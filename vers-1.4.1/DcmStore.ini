AE= FISANDCM2
port= 5600
IMG-DIR= C:\Img\Store
RDSR-DIR= C:\Img\SR
SRsingle= 0
logfile= 1
num_threads= 6
folder-tree= 1
order-by-patientID= 0
order-by-study= 1
order-by-series= 1
image-name-index= 1
extname= dcm
dicomdir= 0


# Be careful don't remove the equal sign '=' 
# The options of some parameters are binary [0/1]: 0 ==> OFF, 1 ==> ON

### Some recommendations
#
# The available options: folder-tree, order-by-patientID, order-by-study, order-by-series
# are provided only to implement the hierarchical mode of creating directories within the main IMG-DIR directory
#
# The optimal maximum number of worker threads (num_threads) should be set based on the server performance (multicore CPU)
#
# If you want to generate the DICOMDIR file you must also enable the image-name-index parameter to be able to index the image names
#
# If SRsingle= 0 the option of the single RDSR-DIR folder is ignored: SRs files are stored in subfolders linked to their serial numbers,  
# under the root folder  IMG-DIR according to the tree architecture patient-study-series model
#
# The extname option (can be a void string) is simply ignored when dicomdir is enabled or when image-name-index is disabled
#